services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: riposte_frontline
      MYSQL_USER: riposte_local
      MYSQL_PASSWORD: riposte_local_dev_only
      MYSQL_ROOT_PASSWORD: riposte_root_dev_only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - riposte_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  riposte_mysql_data:
